name: CI

# Calls the shared job chain in UAMS-Web/uams-ci-workflows at a release tag (never a branch) and
# adds the one job a ruleset requires, `CI`, which fails unless the call reports `success`.
# Template: .claude/skills/code-quality/templates/ci.yml in UAMS-Web/uams-claude-skills.
# This repository is public, so there is no RUN_REMOTE_CI gate. Mutation is on: a pull request mutates only
# the PHP files it changes under `mutate-paths`, and a manual or scheduled run mutates everything `composer mutate` covers.
# The phpcs job is off: the plugin has no phpcs setup. The download archive check runs from its own
# workflow, download-archive.yml.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:
  # The weekly full mutation pass: a scheduled run mutates everything `composer mutate` covers,
  # which catches drift from a dependency or tooling change that no pull request touches. A
  # schedule runs on the default branch, and GitHub disables it after 60 days without
  # repository activity. Mondays at 07:17 UTC.
  schedule:
    - cron: '17 7 * * 1'

# A new push to a pull request cancels that pull request's stale run, so a pull request keeps
# one group. Every other run (a push to the default branch, a manual run) gets a group of its
# own, keyed on the commit, so a later push never cancels it. A shared push group would: GitHub
# keeps one running and one pending run per group and cancels the pending one when another is
# queued, whatever `cancel-in-progress` says, so a merge landing during a long run would cancel
# the previous merge's run before it started a job. Its commit would show a short, settled run
# and the chain would never have run on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.10.1
    with:
      linux-only: true
      mutate-paths: includes uamswp-searchwp-customizations.php
      mutate-ignore-paths: includes uamswp-searchwp-customizations.php
      floor-lint: true
      floor-lint-php: '8.2'
      floor-lint-command: git ls-files -z -- '*.php' ':(exclude)tests' | xargs -0 -n1 php -l > /dev/null
      pest-command: composer test:unit

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call;
  # scripts/check-templates.mjs in UAMS-Web/uams-claude-skills checks it.
  ci:
    name: CI
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a call that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
